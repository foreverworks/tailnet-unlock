# A version tag: the full matrix and the VM scenarios gate a draft release. Its assets are the
# Debian package, the keyholder's single file, the source archive and their checksums, with a build
# provenance attestation for each. The release stays a draft until a person publishes it.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  on-main:
    # a tag is a release only when its commit is on main: a tag on a side branch is refused before
    # anything runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main only"
            exit 1
          fi

  version:
    # the tag, the package version, the module's version and the changelog's newest entry agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/tailnet_unlock/__init__.py").read())
          top = re.search(r"^## (\S+)", open("CHANGELOG.md").read(), re.MULTILINE)
          found = {
              "tag": tag.removeprefix("v"),
              "pyproject.toml": project,
              "__init__.py": init.group(1) if init else None,
              "CHANGELOG.md": top.group(1) if top else None,
          }
          print(found)
          if len(set(found.values())) != 1:
              print(f"::error::the version differs between {', '.join(found)}")
              sys.exit(1)
          PY

  full:
    needs: on-main
    uses: ./.github/workflows/full.yml

  release:
    needs: [version, full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Source archive, Debian package and the keyholder's single file
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir assets
          git archive --format=tar.gz --prefix="tailnet-unlock-$version/" \
            -o "assets/tailnet-unlock-$version.tar.gz" "$GITHUB_SHA"
          tools/build-deb "$version" assets
          python3 tools/build_pyz.py assets
          # the same commit must give the same package and the same file
          tools/build-deb "$version" again
          python3 tools/build_pyz.py again
          cmp "assets/tailnet-unlock_${version}_all.deb" "again/tailnet-unlock_${version}_all.deb"
          cmp assets/tailnet-unlock-keyholder.pyz again/tailnet-unlock-keyholder.pyz
          (cd assets && sha256sum "tailnet-unlock-$version.tar.gz" "tailnet-unlock_${version}_all.deb" \
            tailnet-unlock-keyholder.pyz >SHA256SUMS)
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: assets/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release notes are the newest entry of the changelog
          awk '/^## /{n++} n==1' CHANGELOG.md >notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md assets/*
