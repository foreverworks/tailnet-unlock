# The full matrix: weekly, and as the gate of every release (release.yml calls it).
# Unit tests on every supported Python (3.13, Debian 13's, to 3.15.2, the newest stable) plus the
# next pre-release (3.16.0a2 today) allowed to fail; the container tiers (swtpm, dropbear, real
# images, one TCG boot) on Debian 13 and 14; the VM scenarios on a runner with KVM.
name: full
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    # a fork's pull request never reaches the fleet's runners (it exists only once the repository
    # is public, and then the jobs run on GitHub's)
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && 'tailnet-unlock' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15.2"]
        prerelease: [false]
        include:
          - python: "3.16"
            prerelease: true
    continue-on-error: ${{ matrix.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Python ${{ matrix.python }}
        # uv, not setup-python: the fleet's runners are Debian VMs, which setup-python has no builds for
        run: |
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dash busybox
      - run: uv pip install --python "$RUNNER_TEMP/venv/bin/python" pytest==9.2.0
      - run: make unit PYTHON=python

  container:
    # a fork's pull request never reaches the fleet's runners (it exists only once the repository
    # is public, and then the jobs run on GitHub's)
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && 'tailnet-unlock' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: "13"
            build_args: ""
          - debian: "14"
            build_args: >-
              --build-arg BASE=debian:forky@sha256:15f483ba923e165dde04ac535be6f479a62008ae5fefb42fed21896288ce447a
              --build-arg SUITE=forky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make test BUILD_ARGS="${{ matrix.build_args }}" IMAGE=tailnet-unlock-test:debian-${{ matrix.debian }}

  vm:
    # a fork's pull request never reaches the fleet's runners (it exists only once the repository
    # is public, and then the jobs run on GitHub's)
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && 'tailnet-unlock-kvm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: KVM is usable by the runner user
        run: |
          if [ -c /dev/kvm ] && [ ! -w /dev/kvm ]; then
            # a fresh VM: /dev/kvm is root:kvm 0660 and the runner user is not in the kvm group
            sudo chmod 0666 /dev/kvm || true
          fi
          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner: the VM scenarios need KVM"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::$(id -un) cannot open /dev/kvm (groups: $(id -Gn)); add the runner user to the kvm group"
            ls -l /dev/kvm
            exit 1
          fi
      - name: QEMU, OVMF, swtpm and the guest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm \
            swtpm-tools dropbear-bin python3-pytest openssh-client git xorriso
      - run: make vm-test PYTHON=python3
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vm-logs
          path: ~/.cache/tailnet-unlock/vm/**/*.log
          if-no-files-found: ignore
