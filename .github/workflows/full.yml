# The full matrix: weekly, and as the gate of every release (release.yml calls it).
# Unit tests on every supported Python (3.13, Debian 13's, to 3.15.2, the newest stable) plus the
# next pre-release (3.16.0a2 today) allowed to fail; the container tiers (swtpm, dropbear, real
# images, one TCG boot) on Debian 13 and 14; the VM scenarios on a runner with KVM.
name: full
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15.2"]
        prerelease: [false]
        include:
          - python: "3.16"
            prerelease: true
    continue-on-error: ${{ matrix.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.prerelease }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dash busybox
      - run: python -m pip install pytest==9.2.0
      - run: make unit PYTHON=python

  container:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: "13"
            build_args: ""
          - debian: "14"
            build_args: >-
              --build-arg BASE=debian:forky@sha256:15f483ba923e165dde04ac535be6f479a62008ae5fefb42fed21896288ce447a
              --build-arg SUITE=forky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make test BUILD_ARGS="${{ matrix.build_args }}" IMAGE=tailnet-unlock-test:debian-${{ matrix.debian }}

  vm:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm \
            swtpm-tools dropbear-bin python3-pytest openssh-client
      - run: make vm-test PYTHON=python3
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vm-logs
          path: ~/.cache/tailnet-unlock/vm/**/*.log
          if-no-files-found: ignore
