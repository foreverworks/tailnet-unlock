# One job on every push and pull request: shellcheck, mypy, ruff, the ignore check and the unit
# tests (the busybox and dash tests included) on the newest stable Python, 3.15.2 (python.org,
# read 2026-11-21). While the repository is private the job runs on the fleet's runners (label
# tailnet-unlock); once it is public, on GitHub's.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # a fork's pull request never reaches the fleet's runners (it exists only once the repository
    # is public, and then the jobs run on GitHub's)
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && 'tailnet-unlock' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"
      - name: dash and busybox, the shells the door runs under
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dash busybox
      - name: shellcheck 0.11.0
        run: |
          curl -fsSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: mypy, ruff and pytest
        run: python -m pip install mypy==2.4.1 ruff==0.17.6 pytest==9.2.0
      - run: make check PYTHON=python
