# One job on every push and pull request: shellcheck, mypy, ruff, the ignore check and the unit
# tests (the busybox and dash tests included) on the newest stable Python, 3.15.2 (python.org,
# read 2026-11-21), then builds the Debian package and the keyholder's single file twice and requires
# each two to be byte-equal.
# The container tier installs that package (make deb, in the full workflow). It runs on
# GitHub-hosted runners.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Python 3.15.2
        # uv installs the pinned Python and builds the virtual environment the later steps use
        run: |
          uv python install 3.15.2
          uv venv --python 3.15.2 "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: dash and busybox, the shells the door runs under
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dash busybox
      - name: shellcheck 0.11.0
        run: |
          curl -fsSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: mypy, ruff and pytest
        run: uv pip install --python "$RUNNER_TEMP/venv/bin/python" mypy==2.4.1 ruff==0.17.6 pytest==9.2.0
      - run: make check PYTHON=python
      - name: The Debian package builds, and builds the same twice
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tools/build-deb "$version" "$RUNNER_TEMP/deb1"
          tools/build-deb "$version" "$RUNNER_TEMP/deb2"
          cmp "$RUNNER_TEMP/deb1/tailnet-unlock_${version}_all.deb" "$RUNNER_TEMP/deb2/tailnet-unlock_${version}_all.deb"
          dpkg-deb -I "$RUNNER_TEMP/deb1/tailnet-unlock_${version}_all.deb"
      - name: The keyholder's single file builds, the same twice, and runs
        run: |
          python tools/build_pyz.py "$RUNNER_TEMP/pyz1"
          python tools/build_pyz.py "$RUNNER_TEMP/pyz2"
          cmp "$RUNNER_TEMP/pyz1/tailnet-unlock-keyholder.pyz" "$RUNNER_TEMP/pyz2/tailnet-unlock-keyholder.pyz"
          python -I "$RUNNER_TEMP/pyz1/tailnet-unlock-keyholder.pyz" --version
