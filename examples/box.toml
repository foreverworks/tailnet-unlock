# /etc/tailnet-unlock/box.toml: every key with its default, except the uplink, which has none.
# DESIGN.md section 12.3 explains each one.

[root]
backend = "zfs"              # "zfs"; "luks" from M7

[door]
port = 2222
key_source = "generate"      # or "import": door-keygen --import - reads a key you provision
# recovery = "uplink"        # "off", "uplink" or "uplink+tailnet";
                             # unset: "uplink"
recovery_key_source = "generate"
idle_timeout_seconds = 600

[network]
mode = "dhcp"                # "dhcp" or "static"
interface = "eno1"
match = "name"               # or "mac": the MAC of `interface`, read at each build
# address = "192.0.2.10/24"  # static only
# gateway = "192.0.2.1"
# dns = ["192.0.2.53"]
flush_on_handover = true

[tailnet]
enabled = true               # the one switch for the tailnet door
login_server = ""            # empty: Tailscale; or "https://headscale.example.com"
hostname = ""                # empty: "<host>-unlock"
tags = ["tag:unlock"]

[seal]
profile = "tpm"              # the only profile so far; "measured" is planned and refused

# [rehearsal]
# minutes = 10               # set by enroll, cleared by commit
